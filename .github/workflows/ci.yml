name: CI

on:
  push:
    branches: [main, v4-phone]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile server.py phone/download_model.py
      - name: Downloader help
        run: |
          python phone/download_model.py --help
